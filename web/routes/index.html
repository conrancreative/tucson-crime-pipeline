<body>
  <header
    class="flex flex-wrap items-center gap-5 border-b border-line px-5 py-3 max-[640px]:gap-2.5 max-[640px]:px-3.5 max-[640px]:py-2.5 max-[450px]:flex-col max-[450px]:gap-2">
    <div class="flex items-center gap-2.5 max-[640px]:gap-1">
      <span class="leading-none text-[28px] max-[640px]:text-[22px]" aria-hidden="true">🚲</span>
      <h1 class="m-0 text-[16px] font-bold tracking-[-0.01em] max-[640px]:text-[15px]">Tucson Bike Routes</h1>
    </div>
    <nav aria-label="Tucson Bikes">
      <a class="tab" href="../">Theft map</a>
    </nav>
  </header>

  <section id="view-routes" class="view active" aria-label="Bike routes playground" data-endpoint="/api/bike-routes">
    <aside class="route-panel">
      <details open>
        <summary>Route types</summary>
        <div class="route-actions">
          <button id="routes-all" type="button">Show all</button>
          <button id="routes-none" type="button">Hide all</button>
        </div>
        <div id="route-filters"></div>
        <label class="route-crossing-toggle">
          <input id="route-crossings" type="checkbox" checked>
          <span class="crossing-key" aria-hidden="true">🚦</span>
          Push-button crossings
        </label>
        <label class="route-station-toggle">
          <input id="route-stations" type="checkbox" checked>
          <span class="station-key" aria-hidden="true">🚲</span>
          TuGo bike stations
        </label>
        <label class="route-filter">
          <input id="route-wards" type="checkbox">
          Ward boundaries
        </label>
      </details>
      <p id="route-summary" role="status">Loading local bike data…</p>
      <p id="route-snapshot"></p>
      <button id="routes-fit" type="button">Fit network</button>
      <button id="routes-reload" type="button">Reload local data</button>
    </aside>
    <div id="routes-map" aria-label="Tucson bicycle routes map"></div>
  </section>

  <script src="../shared/common.js"></script>
  <script src="../bike-routes.js"></script>
</body>
</html>
